<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guias do R1 - Meu Locus</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: "Inter", sans-serif; background: #0B0820; color: #EDE6FF; overflow: hidden; }
    .ml-top { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; background: #100C2A; border-bottom: 1px solid rgba(216,184,255,.1); }
    .ml-back { color: #D9B8FF; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .ml-brand { font-size: 0.9rem; font-weight: 600; color: #EDE6FF; font-style: italic; }
    .tabs-wrapper { background: #100C2A; border-bottom: 1px solid rgba(216,184,255,.1); position: relative; }
    .tabs { display: flex; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; text-align: center; padding: 12px 20px; color: rgba(237,230,255,.6); cursor: pointer; white-space: nowrap; font-size: 0.9rem; border-bottom: 2px solid transparent; font-weight: 500; transition: all 0.2s; }
    .tab:hover:not(.locked) { color: #EDE6FF; background: rgba(216,184,255,.05); }
    .tab.active { color: #D9B8FF; border-bottom: 2px solid #D9B8FF; font-weight: 600; background: rgba(216,184,255,.08); }
    .tab.locked { cursor: not-allowed; color: #8A8696; filter: grayscale(1); opacity: 0.55; pointer-events: auto; }
    .tab.locked:hover { background: none; color: #8A8696; }
    .content-frame { width: 100%; height: calc(100% - 92px); border: none; display: block; }
  </style>
</head>
<body>
  <div class="ml-top">
    <a class="ml-back" href="./">← biblioteca</a>
    <span class="ml-brand"><i>meu</i> locus</span>
  </div>
  <div class="tabs-wrapper">
    <div class="tabs">
      <div class="tab active" data-src="pato/index.html">Patologia</div>
      <div class=\"tab\" data-src=\"genetica/index.html\">Genética Médica</div>
      <div class="tab locked" aria-disabled="true" title="Lançamento em breve ✨">Clínica Médica 🔒</div>
      <div class="tab locked" aria-disabled="true" title="Lançamento em breve ✨">Radioterapia 🔒</div>
      <div class="tab locked" aria-disabled="true" title="Lançamento em breve ✨">Radiologia 🔒</div>
      <div class="tab locked" aria-disabled="true" title="Lançamento em breve ✨">Patologia Clínica e Laboratorial 🔒</div>
      <div class="tab locked" aria-disabled="true" title="Lançamento em breve ✨">Medicina de Reabilitação 🔒</div>
    </div>
  </div>
  <iframe class="content-frame" id="frame-0" src="pato/index.html"></iframe>
  <script>
    document.querySelectorAll(".tab").forEach(function (tab) {
      tab.addEventListener("click", function () {
        if (tab.classList.contains("locked")) return; // bloqueadas: lançamento em breve
        document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("active", t === tab); });
        var f = document.getElementById("frame-0");
        if (tab.dataset.src && f.getAttribute("src") !== tab.dataset.src) f.setAttribute("src", tab.dataset.src);
      });
    });
  </script>
</body>
</html>
