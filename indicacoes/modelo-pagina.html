<!DOCTYPE html>
<html lang="pt-BR"><head>
<link rel="icon" href="favicon.svg?v=3" type="image/svg+xml"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TÍTULO · meu locus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600;1,800&display=swap">
<style>
:root{--bg:#100C2A;--bg2:#0B0820;--fg:#EDE6FF;--muted:rgba(237,230,255,.72);--lilac:#D9B8FF;--violet:#A860D8;--blue:#3A5BD0;--orange:#FB923C;--card:rgba(160,96,216,.10);--line:rgba(216,184,255,.26);--serif:"Playfair Display",Georgia,serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:url("padrao-lilas.png") 0 0/620px auto repeat,radial-gradient(760px 460px at 50% -6%,rgba(168,96,216,.34) 0%,rgba(168,96,216,0) 62%),radial-gradient(600px 420px at 100% 100%,rgba(58,91,208,.18) 0%,rgba(58,91,208,0) 60%),linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);background-attachment:fixed;color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 56px;display:grid;gap:30px}
.brand{font-family:var(--serif);font-weight:800;font-size:15px}
.brand i{background:linear-gradient(90deg,var(--blue),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:var(--serif);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:4px 0 0;text-wrap:balance}
h1 em{font-style:italic;color:var(--lilac)}
h2{font-family:var(--serif);font-weight:700;font-size:22px;margin:0 0 10px}
h2 em{color:var(--lilac)}
.lead{color:var(--muted);max-width:66ch;margin:8px 0 0}
section{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
ul{margin:0;padding:0;list-style:none;display:grid;gap:7px}
li{padding-left:16px;position:relative;font-size:14px}
li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--violet)}
li b{color:var(--lilac);font-weight:600}
.rule{font-size:13.5px;border:1px dashed var(--orange);border-radius:12px;padding:10px 14px}
.rule b{color:var(--orange)}
.why{font-size:14.5px;border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:0 14px 14px 0;padding:12px 16px;background:var(--card)}
.foot{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:rgba(237,230,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .25s}
.week{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.week.done{opacity:.6}
.week input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--violet)}
.wk{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--lilac);font-weight:700}
.wt{font-family:var(--serif);font-weight:800;font-size:18px;margin:1px 0 4px;text-wrap:balance}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px;font-size:13px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#100C2A;background:var(--orange);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.slot{margin-top:8px;display:grid;gap:6px}
.slot input[type=text]{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:8px 10px;font:inherit;font-size:13.5px}
.slot input::placeholder{color:rgba(237,230,255,.45)}

.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:99px;margin:2px 6px 2px 0;border:1px solid var(--violet);color:var(--lilac)}
.tag.ub{border-color:#5fd39a;color:#9cf0c6}.tag.ce{border-color:var(--orange);color:var(--orange)}.tag.fp{border-color:var(--blue);color:#a9c8ff}
details{border:1px solid var(--line);border-radius:14px;background:var(--card)}
summary{cursor:pointer;padding:13px 16px;font-family:var(--serif);font-weight:800;font-size:18px;color:var(--fg);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";float:right;color:var(--violet)}
details[open] summary::after{content:"−"}
.in{padding:0 16px 14px;display:grid;gap:6px}
.in h4{margin:10px 0 2px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--lilac);font-weight:700}
.in p{margin:0;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.cal div{border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px;background:var(--card)}
.cal b{color:var(--orange)}
ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}ol b{color:var(--lilac)}

.d{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.d>summary{padding:10px 14px;font-family:var(--sans);font-weight:600;font-size:14px}
.d>summary b{color:var(--orange);margin-right:6px}
.d .in{padding:0 14px 12px}
.d .in p{font-size:13.5px}
.d .in p b{color:var(--lilac)}
h3.mes{font-family:var(--serif);font-weight:800;font-size:17px;margin:14px 0 2px;color:var(--lilac)}
.grp{display:grid;gap:8px}
</style></head><body>

</div>
